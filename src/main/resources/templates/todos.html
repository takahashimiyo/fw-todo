<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>やること一覧</title>
    <link rel="stylesheet" href="/css/style.css">
</head>

<body>
    <main class="container">
        <h1 class="page-title" th:text="${trash ? 'ごみ箱' : 'やること一覧'}">やること一覧</h1>
        <p class="flash" th:if="${message}" th:text="${message}"></p>
        <p th:if="${!trash}"><a class="link" href="/todos/new">新規登録</a> <a class="link" href="/calendar">カレンダーで見る</a> <a class="link" href="/todos?trash=1">ごみ箱を見る</a></p>
        <p th:if="${trash}"><a class="link" href="/todos">一覧に戻る</a></p>
        <p><a class="link" th:href="@{/api/todos.csv(keyword=${keyword}, category=${category}, order=${order}, showCompleted=${showCompleted ? true : null}, trash=${trash ? '1' : null})}">CSVを書き出す</a></p>
        <form class="search-bar" action="/todos" method="get">
            <input th:if="${trash}" type="hidden" name="trash" value="1">
            <input type="hidden" name="order" th:value="${order}">
            <label>やることの名前
                <input class="form-input" type="text" name="keyword" th:value="${keyword}">
            </label>
            <label>ジャンル
                <select class="form-input" name="category">
                    <option value="すべて" th:selected="${category == 'すべて'}">すべて</option>
                    <option th:each="item : ${categories}" th:value="${item}" th:text="${item}"
                        th:selected="${category == item}"></option>
                </select>
            </label>
            <button class="btn" type="submit">絞り込む</button>
        </form>
        <p>
            <a class="link" th:href="@{/todos(keyword=${keyword}, category=${category}, order='asc', showCompleted=${showCompleted ? true : null}, trash=${trash ? '1' : null})}">期限が近い順</a>
            <a class="link" th:href="@{/todos(keyword=${keyword}, category=${category}, order='desc', showCompleted=${showCompleted ? true : null}, trash=${trash ? '1' : null})}">期限が遠い順</a>
        </p>
        <p th:if="${#lists.isEmpty(todos)}" th:text="${trash ? 'ごみ箱は空です' : 'まだ1件も登録されていません'}">まだ1件も登録されていません</p>
        <table class="todo-table" th:unless="${#lists.isEmpty(todos)}">
            <thead>
                <tr>
                    <th>やること</th>
                    <th>ジャンル</th>
                    <th>優先度</th>
                    <th>期限</th>
                    <th>状態</th>
                    <th>操作</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="todo : ${todos}"
                    th:attr="data-overdue=${todo.dueDate != null and todo.dueDate.isBefore(today) and !todo.completed}">
                    <td th:text="${todo.title}"></td>
                    <td th:text="${todo.category}"></td>
                    <td><span th:text="${todo.priority == 1 ? '高' : (todo.priority == 2 ? '中' : '低')}"></span><span
                            class="priority-marker" th:if="${todo.priority == 1}" aria-label="最優先"> ★</span></td>
                    <td th:text="${todo.dueDate}"></td>
                    <td th:text="${todo.completed ? '完了' + (todo.completedAt != null ? '（' + #temporals.format(todo.completedAt, 'yyyy-MM-dd HH:mm') + '）' : '') : '未完了'}"></td>
                    <td th:if="${!trash}"><a class="link" th:href="@{/todos/{id}/edit(id=${todo.id})}">編集</a> <a class="link"
                            th:href="@{/todos/{id}/delete(id=${todo.id})}">削除</a></td>
                    <td th:if="${trash}"><form th:action="@{/todos/{id}/restore(id=${todo.id})}" method="post"><button class="btn" type="submit">戻す</button></form></td>
                </tr>
            </tbody>
        </table>
        <nav class="pagination" th:if="${totalPages > 1}" aria-label="ページ移動">
            <a class="link" th:each="pageNumber : ${#numbers.sequence(1, totalPages)}"
               th:href="@{/todos(keyword=${keyword}, category=${category}, order=${order}, showCompleted=${showCompleted ? true : null}, trash=${trash ? '1' : null}, page=${pageNumber})}"
               th:text="${pageNumber}" th:attr="aria-current=${pageNumber == page ? 'page' : null}"></a>
        </nav>
        <form action="/todos" method="get">
            <input th:if="${trash}" type="hidden" name="trash" value="1">
            <input type="hidden" name="keyword" th:value="${keyword}">
            <input type="hidden" name="category" th:value="${category}">
            <input type="hidden" name="order" th:value="${order}">
            <label>
                <input type="checkbox" name="showCompleted" value="true" th:checked="${showCompleted}">
                完了したものも表示する
            </label>
            <button class="btn" type="submit">表示を更新</button>
        </form>
    </main>
</body>

</html>
