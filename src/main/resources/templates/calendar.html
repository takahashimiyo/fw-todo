<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>カレンダー</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>
    <main class="container calendar-container">
        <h1 class="page-title" th:text="|${year}年${month}月|">年月</h1>
        <nav class="calendar-navigation" aria-label="月の移動">
            <div class="calendar-navigation-group">
                <a class="link" th:href="@{/calendar(year=${previousYear},month=${previousMonth})}">前の月</a>
                <a class="link" th:href="@{/calendar(year=${nextYear},month=${nextMonth})}">次の月</a>
            </div>
            <div class="calendar-navigation-group">
                <a class="link" href="/todos">表で見る</a>
                <a class="link" href="/todos/new">新規登録</a>
            </div>
        </nav>
        <table class="calendar-table" th:attr="data-from=${firstDay},data-to=${lastDay}">
            <thead>
                <tr>
                    <th scope="col">日</th>
                    <th scope="col">月</th>
                    <th scope="col">火</th>
                    <th scope="col">水</th>
                    <th scope="col">木</th>
                    <th scope="col">金</th>
                    <th scope="col">土</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="week : ${#numbers.sequence(0, days.size() / 7 - 1)}">
                    <td th:each="day : ${days.subList(week * 7, week * 7 + 7)}" th:attr="data-date=${day}"
                        th:text="${day == null ? '' : day.dayOfMonth}"></td>
                </tr>
            </tbody>
        </table>
    </main>
    <script>
        async function showTodos() {
            const calendar = document.querySelector(".calendar-table");
            const from = calendar.dataset.from;
            const to = calendar.dataset.to;
            const params = new URLSearchParams({ from, to });
            const res = await fetch(`/api/todos?${params}`);
            const todos = await res.json();
            const now = new Date();
            const today = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, "0")}-${String(now.getDate()).padStart(2, "0")}`;

            for (const cell of calendar.querySelectorAll("td[data-date]")) {
                const matchingTodos = todos.filter(todo => todo.dueDate === cell.dataset.date);
                for (const todo of matchingTodos.slice(0, 3)) {
                    const name = document.createElement("a");
                    name.className = "link";
                    name.href = `/todos/${todo.id}/edit`;
                    name.textContent = todo.title;
                    if (todo.dueDate < today && !todo.completed) {
                        name.style.color = "red";
                    }
                    cell.appendChild(name);
                }
                if (matchingTodos.length > 3) {
                    const more = document.createElement("div");
                    more.textContent = `ほか ${matchingTodos.length - 3}件`;
                    cell.appendChild(more);
                }
            }
        }

        async function colorSpecialDays() {
            const calendar = document.querySelector(".calendar-table");
            const from = calendar.dataset.from;
            const to = calendar.dataset.to;
            const params = new URLSearchParams({ from, to });
            const res = await fetch(`/api/holidays?${params}`);

            if (res.headers.has("X-Holidays-Unavailable")) {
                const message = document.createElement("p");
                message.textContent = "祝日を取れませんでした";
                calendar.parentElement.insertBefore(message, calendar);
            }

            const holidays = await res.json();
            for (const cell of calendar.querySelectorAll("td[data-date]")) {
                const date = new Date(`${cell.dataset.date}T00:00:00`);
                const weekday = date.getDay();

                if (Object.hasOwn(holidays, cell.dataset.date)) {
                    cell.style.backgroundColor = "#ffe4b5";
                    cell.title = holidays[cell.dataset.date];
                } else if (weekday === 0) {
                    cell.style.backgroundColor = "#f8d7da";
                } else if (weekday === 6) {
                    cell.style.backgroundColor = "#dbeafe";
                }
            }
        }

        showTodos();
        colorSpecialDays();
    </script>
</body>

</html>
