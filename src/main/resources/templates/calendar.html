<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>カレンダー</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>
    <main class="container calendar-container">
        <h1 class="page-title" th:text="|${year}年${month}月|">年月</h1>
        <nav class="calendar-navigation" aria-label="月の移動">
            <div class="calendar-navigation-group">
                <a class="link" th:href="@{/calendar(year=${previousYear},month=${previousMonth})}">前の月</a>
                <a class="link" th:href="@{/calendar(year=${nextYear},month=${nextMonth})}">次の月</a>
            </div>
            <div class="calendar-navigation-group">
                <a class="link" href="/todos">表で見る</a>
                <a class="link" href="/todos/new">新規登録</a>
            </div>
        </nav>
        <table class="calendar-table" th:attr="data-from=${firstDay},data-to=${lastDay}">
            <thead>
                <tr>
                    <th scope="col">日</th>
                    <th scope="col">月</th>
                    <th scope="col">火</th>
                    <th scope="col">水</th>
                    <th scope="col">木</th>
                    <th scope="col">金</th>
                    <th scope="col">土</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="week : ${#numbers.sequence(0, days.size() / 7 - 1)}">
                    <td th:each="day : ${days.subList(week * 7, week * 7 + 7)}" th:attr="data-date=${day}"
                        th:text="${day == null ? '' : day.dayOfMonth}"></td>
                </tr>
            </tbody>
        </table>
    </main>
    <script>
        async function showTodos() {
            const calendar = document.querySelector(".calendar-table");
            const from = calendar.dataset.from;
            const to = calendar.dataset.to;
            const params = new URLSearchParams({ from, to });
            const res = await fetch(`/api/todos?${params}`);
            const todos = await res.json();
            const now = new Date();
            const today = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, "0")}-${String(now.getDate()).padStart(2, "0")}`;

            for (const cell of calendar.querySelectorAll("td[data-date]")) {
                const matchingTodos = todos.filter(todo => todo.dueDate === cell.dataset.date);
                for (const todo of matchingTodos.slice(0, 3)) {
                    const name = document.createElement("a");
                    name.className = "link";
                    name.href = `/todos/${todo.id}/edit`;
                    name.textContent = todo.title;
                    if (todo.dueDate < today && !todo.completed) {
                        name.style.color = "red";
                    }
                    cell.appendChild(name);
                }
                if (matchingTodos.length > 3) {
                    const more = document.createElement("div");
                    more.textContent = `ほか ${matchingTodos.length - 3}件`;
                    cell.appendChild(more);
                }
            }
        }

        async function colorSpecialDays() {
            const calendar = document.querySelector(".calendar-table");
            const from = calendar.dataset.from;
            const to = calendar.dataset.to;
            const params = new URLSearchParams({ from, to });
            const res = await fetch(`/api/holidays?${params}`);

            if (res.headers.has("X-Holidays-Unavailable")) {
                const message = document.createElement("p");
                message.textContent = "祝日を取れませんでした";
                calendar.parentElement.insertBefore(message, calendar);
            }

            const holidays = await res.json();
            for (const cell of calendar.querySelectorAll("td[data-date]")) {
                const date = new Date(`${cell.dataset.date}T00:00:00`);
                const weekday = date.getDay();

                if (Object.hasOwn(holidays, cell.dataset.date)) {
                    cell.style.backgroundColor = "#ffe4b5";
                    cell.title = holidays[cell.dataset.date];
                } else if (weekday === 0) {
                    cell.style.backgroundColor = "#f8d7da";
                } else if (weekday === 6) {
                    cell.style.backgroundColor = "#dbeafe";
                }
            }
        }

        async function showWeather() {
            try {
                const res = await fetch("/api/weather");
                if (!res.ok || res.headers.has("X-Weather-Unavailable")) {
                    return;
                }

                const weather = await res.json();
                const weatherTypes = {
                    0: { icon: "☀️", label: "快晴" }, 1: { icon: "🌤️", label: "晴れ" },
                    2: { icon: "⛅", label: "くもり時々晴れ" }, 3: { icon: "☁️", label: "くもり" },
                    45: { icon: "🌫️", label: "霧" }, 48: { icon: "🌫️", label: "霧" },
                    51: { icon: "🌦️", label: "弱い霧雨" }, 53: { icon: "🌦️", label: "霧雨" },
                    55: { icon: "🌧️", label: "強い霧雨" }, 56: { icon: "🌧️", label: "凍る霧雨" },
                    57: { icon: "🌧️", label: "凍る霧雨" }, 61: { icon: "🌧️", label: "弱い雨" },
                    63: { icon: "🌧️", label: "雨" }, 65: { icon: "🌧️", label: "強い雨" },
                    66: { icon: "🌧️", label: "凍る雨" }, 67: { icon: "🌧️", label: "凍る雨" },
                    71: { icon: "🌨️", label: "弱い雪" }, 73: { icon: "🌨️", label: "雪" },
                    75: { icon: "❄️", label: "強い雪" }, 77: { icon: "🌨️", label: "あられ" },
                    80: { icon: "🌦️", label: "にわか雨" }, 81: { icon: "🌧️", label: "雨" },
                    82: { icon: "🌧️", label: "強いにわか雨" }, 85: { icon: "🌨️", label: "にわか雪" },
                    86: { icon: "❄️", label: "強いにわか雪" }, 95: { icon: "⛈️", label: "雷雨" },
                    96: { icon: "⛈️", label: "ひょうを伴う雷雨" }, 99: { icon: "⛈️", label: "強いひょうを伴う雷雨" }
                };
                for (const forecast of weather.forecasts ?? []) {
                    const cell = [...document.querySelectorAll("td[data-date]")]
                        .find(dayCell => dayCell.dataset.date === forecast.date);
                    if (!cell || forecast.weatherCode == null || forecast.temperatureMin == null
                            || forecast.temperatureMax == null) {
                        continue;
                    }

                    const weatherType = weatherTypes[forecast.weatherCode] ?? { icon: "🌡️", label: "天気情報" };
                    const display = document.createElement("div");
                    display.textContent = `${weatherType.icon} ${forecast.temperatureMin}° / ${forecast.temperatureMax}°C`;
                    display.title = `東京の予報: ${weatherType.label}、最低${forecast.temperatureMin}°C、最高${forecast.temperatureMax}°C`;
                    cell.appendChild(display);
                }
            } catch (error) {
                // 天気を取得できなくても、カレンダーの表示は続けます。
            }
        }

        showTodos();
        colorSpecialDays();
        showWeather();
    </script>
</body>

</html>
