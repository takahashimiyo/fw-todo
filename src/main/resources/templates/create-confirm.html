<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>登録内容の確認</title><link rel="stylesheet" href="/css/style.css"></head>
<body><div class="app-layout"><aside th:replace="~{fragments/sidebar :: sidebar('new')}"></aside><main class="container content-card form-card">
    <p class="eyebrow">MY TODO / 新規登録</p>
    <h1 class="page-title">登録内容の確認</h1>
    <p class="confirm-value">やること：<span th:text="${todo.title}"></span></p>
    <p class="confirm-value">メモ：<span th:text="${#strings.isEmpty(todo.detail) ? '（入力なし）' : todo.detail}"></span></p>
    <p class="confirm-value">ジャンル：<span th:text="${todo.category}"></span></p>
    <p class="confirm-value">優先度：<span th:text="${todo.priority == 1 ? '高' : (todo.priority == 2 ? '中' : '低')}"></span></p>
    <p class="confirm-value">期限：<span th:text="${todo.dueDate == null ? '（入力なし）' : todo.dueDate}"></span></p>
    <div class="confirm-actions">
        <form action="/todos" method="post" th:object="${todo}"><input type="hidden" th:field="*{title}"><input type="hidden" th:field="*{detail}"><input type="hidden" th:field="*{category}"><input type="hidden" th:field="*{priority}"><input type="hidden" th:field="*{dueDate}"><button class="btn" type="submit">登録する</button></form>
        <form action="/todos/new" method="post" th:object="${todo}"><input type="hidden" th:field="*{title}"><input type="hidden" th:field="*{detail}"><input type="hidden" th:field="*{category}"><input type="hidden" th:field="*{priority}"><input type="hidden" th:field="*{dueDate}"><button class="btn sub" type="submit">書き直す</button></form>
    </div>
</main></div></body></html>
