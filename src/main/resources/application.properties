spring.application.name=todoapp
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/todoapp}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=${MYSQL_ROOT_PASSWORD:password}
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.configuration.map-underscore-to-camel-case=true
spring.sql.init.mode=always
spring.ai.mcp.server.protocol=STREAMABLE
weather.latitude=${WEATHER_LATITUDE:35.68}
weather.longitude=${WEATHER_LONGITUDE:139.76}
